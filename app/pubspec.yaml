name: luna_app
description: "Luna — управление обувным цехом"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Состояние. Riverpod 2 с кодогенерацией: AsyncValue закрывает
  # loading/error без ручного FutureBuilder на каждом экране.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Навигация с редиректом по авторизации и роли.
  go_router: ^14.6.2

  # Сеть.
  dio: ^5.7.0

  # Модели: неизменяемые, с разбором JSON без ручного кода.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Токены не в SharedPreferences: на Android это обычный XML,
  # доступный любому, кто получил root или бэкап.
  flutter_secure_storage: ^9.2.2

  # Деньги. Суммы приходят строками именно потому, что float теряет
  # копейки — парсить их в double значит вернуть ту же проблему.
  decimal: ^3.0.2

  intl: ^0.20.2
  fl_chart: ^0.69.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
