name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Prisma Client генерируется из schema.prisma и в репозиторий не
      # коммитится — без него не пройдёт ни typecheck, ни сборка.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Сценарии из test/ здесь не запускаются: им нужна живая PostgreSQL
      # с применённым seed. Поднимать её ради текущего набора проверок
      # дороже, чем прогонять их вручную перед релизом.
      - run: npm test
