services:
  postgres:
    image: postgres:16-alpine
    container_name: luna-postgres
    environment:
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna
      POSTGRES_DB: luna
    ports:
      - "5432:5432"
    volumes:
      - luna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luna"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luna-redis
    ports:
      - "6379:6379"
    volumes:
      - luna-redisdata:/data

volumes:
  luna-pgdata:
  luna-redisdata:
